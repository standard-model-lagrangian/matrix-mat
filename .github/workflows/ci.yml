name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast:
    name: Fast Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (syntax errors and undefined names)
        run: |
          ruff check --select E9,F63,F7,F82 src tests tools spheroid_pipeline_v2 spheroid_if_sweep

      - name: Type-check core
        run: |
          mypy src/matrix_mat/core --ignore-missing-imports

      - name: Run fast test suite with coverage gates
        run: |
          pytest -m "not slow and not dl and not realdata" --cov=src/matrix_mat --cov-report=term --cov-fail-under=60
          coverage report --include="src/matrix_mat/core/*" --fail-under=80

  locked:
    name: Locked Dependencies Integration Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install -e . --no-deps
          pip install pytest pytest-cov

      - name: Run integration and regression/golden tests
        run: |
          pytest tests/integration tests/regression

  dl:
    name: Deep Learning Model Weights Verification (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev and dl dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,dl]

      - name: Fetch and verify model weights
        run: |
          python tools/fetch_models.py --verify-only || python tools/fetch_models.py

      - name: Run deep learning tests
        run: |
          pytest -m dl
