name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly, Monday 04:00 UTC (runs the slow suite)

jobs:
  fast:
    name: Fast Unit Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff E,F,B; settings in pyproject [tool.ruff])
        run: |
          ruff check --select E,F,B --ignore E501 src tests tools run_pipeline.py spheroid_pipeline_v2 spheroid_if_sweep

      - name: Type-check (core, reporting, CLI)
        run: |
          mypy src/matrix_mat/core src/matrix_mat/reporting src/matrix_mat/cli.py --ignore-missing-imports --follow-imports=silent

      - name: Run fast test suite with coverage gates
        run: |
          pytest -m "not slow and not dl and not realdata" --cov=src/matrix_mat --cov-report=term --cov-fail-under=60
          coverage report --include="src/matrix_mat/core/*" --fail-under=80

  locked:
    name: Locked Dependencies Integration Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Run integration and regression/golden tests
        run: |
          pytest tests/integration tests/regression

  dl:
    name: Deep Learning Model Weights Verification (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev and dl dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,dl]

      - name: Fetch and verify model weights
        run: |
          python tools/fetch_models.py --verify-only || python tools/fetch_models.py

      - name: Run deep learning tests
        run: |
          pytest -m dl

  slow:
    name: Slow Tests (scheduled / manual, Python 3.12)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run slow test suite
        run: |
          pytest -m "slow and not dl and not realdata" tests
