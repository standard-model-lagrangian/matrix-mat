[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-mat"
version = "0.2.1"
description = "High-precision, QC-audited image analysis pipelines for brightfield spheroid volume changes and immunofluorescence nuclear density."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Material Discovery Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "tifffile>=2023.9.0",
    "pillow>=10.0.0",
    "imagecodecs>=2023.1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "statsmodels>=0.14.0",
    "hypothesis>=6.80.0",
]
dl = [
    "torch>=2.1.0",
    "cellpose>=4.0.0",
]

[project.scripts]
matrix-mat = "matrix_mat.cli:main"
spheroid-brightfield = "matrix_mat.brightfield.run_pipeline:main"
spheroid-if = "matrix_mat.if_density.sweep:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["matrix_mat*", "spheroid_pipeline_v2*", "spheroid_if_sweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:fast_array_utils --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "dl: marks tests as requiring deep learning weights/models (deselect with '-m \"not dl\"')",
    "realdata: marks tests requiring external real microscopy data (deselect with '-m \"not realdata\"')",
]

