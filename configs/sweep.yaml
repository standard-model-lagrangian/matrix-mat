# Master Configuration for Multi-Run Spheroid IF Segmentation Sweep
data_dir: "${DATA_ROOT}/if"
runs_dir: "${OUTPUT_ROOT}/runs"
allow_unpaired: true
overwrite: false
random_seed: 42
default_pixel_size_um: 0.5050492474122553
# Refuse fields without embedded scale metadata (all shipped data are calibrated).
allow_uncalibrated: false
# Cross-run comparison run after the sweep: prepost | generic
comparator: "generic"

# Cellpose-SAM model settings
model:
  pretrained_model: "${MODELS_ROOT}/cpsam_v2"
  model_type: "cpsam"
  use_gpu: true

# The 4 Sweep Configurations
combos:
  - slug: "001_A_baseline"
    name: "A_baseline"
    description: "Current defaults as control (cpsam defaults: flow_threshold=0.4, cellprob_threshold=0.0, diameter=None, no stitching)"
    flow_threshold: 0.4
    cellprob_threshold: 0.0
    diameter: null
    min_size: 15
    stitch_threshold: 0.0
    do_3D: false

  - slug: "002_B_sensitive"
    name: "B_sensitive"
    description: "Recover dim/under-segmented nuclei (cellprob_threshold=-2.0, flow_threshold=0.8)"
    flow_threshold: 0.8
    cellprob_threshold: -2.0
    diameter: null
    min_size: 15
    stitch_threshold: 0.0
    do_3D: false

  - slug: "003_C_conservative"
    name: "C_conservative"
    description: "Suppress debris/over-segmentation (cellprob_threshold=1.0, flow_threshold=0.2, min_size=30)"
    flow_threshold: 0.2
    cellprob_threshold: 1.0
    diameter: null
    min_size: 30
    stitch_threshold: 0.0
    do_3D: false

  - slug: "004_D_3d"
    name: "D_3d"
    # 3D/stitching is not supported (inputs are single-plane 2D; do_3D: true fails validation). Kept under
    # its historical slug as a 2D control: its parameters equal A_baseline, so its outputs should too
    # (the comparators warn when two runs are identical).
    description: "Historical 3D slot, now a 2D control identical to A_baseline (3D unsupported on single-plane data)"
    flow_threshold: 0.4
    cellprob_threshold: 0.0
    diameter: null
    min_size: 15
    stitch_threshold: 0.0
    do_3D: false

# QC Gating Thresholds
qc:
  snr_min: 1.5
  min_nuclear_vol_um3: 150.0   # ~6.6 um equivalent spherical diameter
  max_nuclear_vol_um3: 4000.0  # ~19.7 um equivalent spherical diameter
  border_margin_px: 5
  edge_heavy_fraction: 0.25
  saturation_fraction_max: 0.005
  # Blur flag on the RAW nuclear channel: Laplacian variance below an absolute threshold.
  # 150 is provisional: on the 27 SKOV3 fields raw values span 133-481 and only Mat-Gel1-3 (133)
  # falls below it. Confirm by visual review before relying on it.
  blur_mode: "absolute"
  blur_abs_threshold: 150.0
  outlier_iqr_factor: 1.5

# Features and summary settings
features:
  spheroid_extent_method: "actin_threshold"  # 'actin_threshold' or 'nuclei_convex_hull'
