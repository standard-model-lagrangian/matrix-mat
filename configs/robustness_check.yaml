# Robustness Regression Sweep Configuration
# Re-runs the 4 original Cellpose-SAM configs (verbatim) with the winning PP11 pre/post stack applied.
data_dir: "Experimental data /Chuling cells/spheroids staining:IF /nuclei density analysis"
runs_dir: "runs"
allow_unpaired: true
overwrite: false
random_seed: 42
default_pixel_size_um: 0.5050492474122553

model:
  pretrained_model: "models/cpsam_v2"
  model_type: "cpsam"
  use_gpu: true

# Winning pre/post processing configuration applied across all 4 hyperparameter regimes
preprocessing:
  enabled: true
  expected_nuclear_diameter_um: 11.7
  background:
    method: "rolling_ball"
    radius_multiplier: 3.5
    downsample_factor: 2
  normalize:
    enabled: true
    p_low: 1.0
    p_high: 99.8
  denoise:
    method: "none"

postprocessing:
  enabled: true
  deduplicate:
    iou_threshold: 0.50
  size_gate:
    enabled: true
    min_vol_um3: 210.0
    max_vol_um3: 3364.0
  splitting:
    enabled: true
    method: "seeded_watershed"
    split_factor: 2.0
    h_maxima: 10.0
    min_distance_um: 4.0
  border_exclusion:
    enabled: true
    clearance_um: 5.85

combos:
  - slug: "201_A_baseline_pp"
    name: "A_baseline_pp"
    description: "Control baseline with winning PP11 stack (flow_threshold=0.4, cellprob_threshold=0.0)"
    flow_threshold: 0.4
    cellprob_threshold: 0.0
    diameter: null
    min_size: 15
    stitch_threshold: 0.0
    do_3D: false

  - slug: "202_B_sensitive_pp"
    name: "B_sensitive_pp"
    description: "Sensitive regime with winning PP11 stack (flow_threshold=0.8, cellprob_threshold=-2.0)"
    flow_threshold: 0.8
    cellprob_threshold: -2.0
    diameter: null
    min_size: 15
    stitch_threshold: 0.0
    do_3D: false

  - slug: "203_C_conservative_pp"
    name: "C_conservative_pp"
    description: "Conservative regime with winning PP11 stack (flow_threshold=0.2, cellprob_threshold=1.0, min_size=30)"
    flow_threshold: 0.2
    cellprob_threshold: 1.0
    diameter: null
    min_size: 30
    stitch_threshold: 0.0
    do_3D: false

  - slug: "204_D_3d_pp"
    name: "D_3d_pp"
    description: "Volumetric mode with winning PP11 stack (stitch_threshold=0.7, do_3D=true)"
    flow_threshold: 0.4
    cellprob_threshold: 0.0
    diameter: null
    min_size: 15
    stitch_threshold: 0.7
    do_3D: true

qc:
  snr_min: 1.5
  min_nuclear_vol_um3: 150.0
  max_nuclear_vol_um3: 4000.0
  border_margin_px: 5
  edge_heavy_fraction: 0.25
  saturation_fraction_max: 0.005
  blur_percentile_cutoff: 10.0
  duplicate_iou_threshold: 0.50
  outlier_iqr_factor: 1.5

features:
  spheroid_extent_method: "actin_threshold"
  actin_background_percentile: 50.0
