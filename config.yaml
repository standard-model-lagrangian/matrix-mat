# ==============================================================================
# Master Configuration: Brightfield Spheroid Volume-Change Pipeline (t0 vs t7)
# ==============================================================================
# NOTE: This root config.yaml is maintained for backwards-compatibility.
# The canonical configuration file is located at configs/spheroid_brightfield.yaml.
# Both files share the exact same schema.
# ==============================================================================

# Directory Paths
t0_dir: "Experimental data /Chuling cells/Spheroid Day0 260805"
t7_dir: "Experimental data /Chuling cells/Spheroid D7 260812"
output_dir: "output"
review_dir: "review"

# Optical Calibration & Determinism
default_pixel_size_um: 1.518817  # EVOS 4x objective calibration extracted from TIFF headers
cli_pixel_size_um: null
random_seed: 42

# Preprocessing
preprocess:
  flat_field_sigma: 0.0  # Set to 0.0: disable Gaussian division which flattens spheroid contrast
  percentile_low: 1.0
  percentile_high: 99.0
  save_corrected_images: true
  target_diameter_px: 200.0

# Segmentation
segmentation:
  backend: "cpsam"  # 'cpsam' | 'cellpose' | 'classical'
  cpsam_model_path: "models/cpsam_v2"
  cache_dir: "masks"
  cpsam_expected_diameter_px: 160.0
  cpsam_flow_threshold: 0.4
  cpsam_cellprob_threshold: 0.0
  cpsam_min_size_px: 40
  adaptive_window_sizes: [31, 61, 121, 241]
  morph_open_radius: 2
  morph_close_radius: 4
  watershed_min_distance_px: 25
  hough_fallback_enabled: true
  hough_min_radius_um: 25.0
  hough_max_radius_um: 600.0

# Quality Control (QC) Gates
qc:
  min_d_um: 40.0
  max_d_um: 1500.0
  min_pass_diameter_um: 40.0
  max_pass_diameter_um: 1200.0
  border_margin_px: 15
  ring_width_px: 15
  ring_contrast_factor: 0.90
  max_single_mask_area_fraction: 0.25
  min_circularity: 0.65
  min_solidity: 0.85
  max_eccentricity: 0.82
  max_objects_per_fov: 0

# Spheroid Pairing
pairing:
  max_centroid_shift_fraction: 1.5
  min_displacement_px: 50.0
  fallback_greedy: true

# Population Statistics
stats:
  control_condition: "Mat"  # Baseline condition for permutation tests
  min_denominator_d0_um: 60.0
  min_fold_change: 0.1
  max_fold_change: 20.0
  bootstrap_iterations: 2000
  permutation_iterations: 10000
  confidence_level: 0.95
  include_review_in_stats: false

# Supervision Artifacts
artifacts:
  overlay_dir: "overlays"
  contact_sheets_dir: "contact_sheets"
  figures_dir: "figures"
  save_pdf: true
  save_png: true
  contact_sheet_cols: 4
  contact_sheet_dpi: 150
  figure_dpi: 300
